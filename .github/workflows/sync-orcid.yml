name: Sincronizar publicações (ORCID)

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 em Brasília
  workflow_dispatch:       # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_pubs.py
      - name: Commit se houver paper novo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "libnm-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Atualiza publicações a partir do ORCID"
            git push
          fi
